name: iOS build

# Builds an unsigned Muriel.ipa on a GitHub macOS runner and publishes it to the rolling
# "ios-latest" release. Install it with TrollStore on supported firmware, or sign it with
# Sideloadly, AltStore or SideStore using your Apple ID.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'site/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # desktop-only dev dependency, not needed here
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check iOS 15 compatibility (source)
        run: node tools/check-ios15-compat.mjs

      - name: Build the web bundle
        run: node mobile/build.mjs

      - name: Sync into the Xcode project
        run: npx cap sync ios

      - name: Check iOS 15 compatibility (after sync)
        run: node tools/check-ios15-compat.mjs

      - name: Compile (unsigned)
        run: |
          xcodebuild -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Confirm app is iOS 15 and widget is iOS 16.2
        run: |
          app="build/Build/Products/Release-iphoneos/App.app"
          app_min=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")
          widget_min=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/PlugIns/MurielWidgets.appex/Info.plist")
          minos=$(otool -l "$app/App" | awk '/minos/{print $2; exit}')
          test "$app_min" = "15.0"
          test "$minos" = "15.0"
          test "$widget_min" = "16.2"
          echo "App minimum: $app_min (LC_BUILD_VERSION minos $minos)"
          echo "Widget minimum: $widget_min"

      - name: Package Muriel.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Muriel.ipa Payload
          shasum -a 256 Muriel.ipa > Muriel.ipa.sha256
          cat Muriel.ipa.sha256
          ls -lh Muriel.ipa

      - name: Write the SideStore / AltStore source
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: node .github/sidestore-source.js

      - uses: actions/upload-artifact@v4
        with:
          name: Muriel-ipa
          path: |
            Muriel.ipa
            Muriel.ipa.sha256

      - name: Publish to the ios-latest release
        # test branches only get the workflow artifact; the public release follows main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # only the newest commit on main replaces the public build (a re-run of an older run would
          # otherwise put an older build back)
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main is at ${head::7} now; not publishing ${GITHUB_SHA::7}"; exit 0; fi
          # downloads so far, kept across builds (GitHub resets the count when the file is replaced; the
          # website adds this to the new file's count). 1640 = downloads counted before this existed
          before="$(bash .github/carry-downloads.sh ios-latest Muriel.ipa 1640)"
          ver="$(node -p "require('./package.json').version")"
          gh release delete ios-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios-latest Muriel.ipa Muriel.ipa.sha256 sidestore.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Muriel for iPhone (latest build)" \
            --notes "Muriel $ver. Unsigned build of ${GITHUB_SHA::7} (run ${{ github.run_number }}). Install with TrollStore on supported devices/firmware (no Apple ID, no 7-day expiry), or sign it with Sideloadly, AltStore or SideStore using your Apple ID. Free Apple IDs need re-signing every 7 days. The SHA-256 of Muriel.ipa is in Muriel.ipa.sha256.<!-- muriel-downloads-before: $before --><!-- muriel-version: $ver -->"
