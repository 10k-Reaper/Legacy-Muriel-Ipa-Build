name: Build iOS 15 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios15-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the iOS web bundle
        run: node mobile/build.mjs

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Compile for iOS (unsigned)
        run: |
          xcodebuild -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Confirm app supports iOS 15
        run: |
          app="build/Build/Products/Release-iphoneos/App.app/Info.plist"
          minimum_ios=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app")
          test "$minimum_ios" = "15.0"
          echo "Built app minimum iOS version: $minimum_ios"

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app ipa/Payload/
          (cd ipa && /usr/bin/zip -qry ../Muriel-iOS15.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muriel-iOS15-IPA
          path: Muriel-iOS15.ipa
          if-no-files-found: error
          retention-days: 14
