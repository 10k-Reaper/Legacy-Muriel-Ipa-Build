name: Release

# Builds the unsigned iOS 15 IPA and attaches it to a versioned GitHub release.
# Push a v* tag, or run this workflow from the Actions tab with a version; in that
# case the workflow creates the tag itself.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.3.10 (the tag becomes v1.3.10)'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  ipa:
    name: Build and publish unsigned IPA
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # desktop-only dev dependency, not needed here

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read the release version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check iOS 15 compatibility (source)
        run: node tools/check-ios15-compat.mjs

      - name: Build the web bundle
        run: node mobile/build.mjs

      - name: Sync into the Xcode project
        run: npx cap sync ios

      - name: Check iOS 15 compatibility (after sync)
        run: node tools/check-ios15-compat.mjs

      - name: Compile (unsigned)
        run: |
          xcodebuild -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Confirm app is iOS 15 and widget is iOS 16.2
        run: |
          app="build/Build/Products/Release-iphoneos/App.app"
          app_min=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")
          widget_min=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/PlugIns/MurielWidgets.appex/Info.plist")
          minos=$(otool -l "$app/App" | awk '/minos/{print $2; exit}')
          test "$app_min" = "15.0"
          test "$minos" = "15.0"
          test "$widget_min" = "16.2"
          echo "App minimum: $app_min (LC_BUILD_VERSION minos $minos)"
          echo "Widget minimum: $widget_min"

      - name: Package Muriel.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Muriel.ipa Payload
          shasum -a 256 Muriel.ipa > Muriel.ipa.sha256
          cat Muriel.ipa.sha256
          ls -lh Muriel.ipa

      - name: Write the SideStore / AltStore source
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          IPA_NAME: Muriel.ipa
        run: node .github/sidestore-source.js

      - name: Render the release notes
        run: sed "s/__VERSION__/$VERSION/g" .github/release-notes-ios.md > release-notes-ios.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its notes."
            gh release edit "$TAG" \
              --title "Muriel Legacy iOS ${TAG#v}" \
              --notes-file release-notes-ios.md
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Creating release $TAG for the existing tag."
            gh release create "$TAG" \
              --title "Muriel Legacy iOS ${TAG#v}" \
              --notes-file release-notes-ios.md
          else
            echo "Creating tag $TAG and its release."
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Muriel Legacy iOS ${TAG#v}" \
              --notes-file release-notes-ios.md
          fi

      - name: Upload the IPA, checksum and SideStore source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" Muriel.ipa Muriel.ipa.sha256 sidestore.json --clobber
